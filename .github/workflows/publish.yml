name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 仅当推送类似 v1.0.0 的标签时触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 必需，用于生成 OIDC 令牌

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'  # 必须 ≥ 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package (if applicable)
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        # 无需设置 NODE_AUTH_TOKEN，npm 会自动使用 OIDC
