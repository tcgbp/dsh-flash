# dsh-flash bundle layer — registers the HOST half into a profile.
#
# The BROWSER half needs no row here: the module loader auto-discovers the
# client bundle from package.json `exports["./client"]` + `dsh.client` and
# serves it at /plugins/<pkg>/client.js.
#
# PITFALL: `name` is a PACKAGE NAME (resolved via the profile's node_modules),
# NOT a relative path.
#
# WHY `id` MUST MATCH `name` NOW: the entry id IS the settings namespace
# (docs/refactor-plan-core-adapter-split.md §1.4, D1=M1 = the plugin's exported
# `name`). This package has MOVED its id/namespace from `dock-flash` to
# `dsh-flash` to match the package name — see the one-time host migration in
# src/index.ts (migratePrefsFromDockFlash), which copies any prefs still
# persisted under the legacy `dock-flash` namespace. If `id` drifts from the
# code's `name`, DSH silently drops the whole `config:` block for this row.
# The adapter (`dock-flash`) does NOT insert this row for the core: a plain
# dependency is hoisted but only rows are composed, so the core ships its own.
- insert:
    - id: dsh-flash
      name: dsh-flash
